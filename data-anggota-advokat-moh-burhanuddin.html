<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ══════════════════════════════════════
         EDIT DATA ANGGOTA DI SINI
    ══════════════════════════════════════ -->
    <script>
        var ANGGOTA = {
            nama: "Moh. Burhanuddin, S.H.",  /* Isi nama lengkap anggota di sini */
            no: "25.10.00101", /* Isi nomor anggota di sini */
            tahun: "2025", /* Isi tahun pengesahan di sini */
            foto: "asset/kta/ktaburhanuddin.png"   /* Isi URL foto di sini, atau biarkan kosong */
        };
    </script>
    <!-- ══════════════════════════════════════ -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" href="asset/PERADI.png" type="image/png">
    <style>
        :root {
            --primary: #0a2342;
            --primary-soft: #2c4c7c;
            --secondary: #c9a959;
            --secondary-dark: #a8832f;
            --gray: #8a96a8;
            --gray-light: #e8ecf2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a2342;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px;
            right: -120px;
            width: 480px;
            height: 480px;
            border: 80px solid rgba(201, 169, 89, 0.06);
            border-radius: 50%;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -80px;
            left: -80px;
            width: 320px;
            height: 320px;
            border: 60px solid rgba(201, 169, 89, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }

        .card {
            background: #fff;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.35);
            animation: cardUp 0.5s cubic-bezier(.22, .68, 0, 1.2) both;
            position: relative;
            z-index: 2;
        }

        @keyframes cardUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.97)
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1)
            }
        }

        .card-header {
            background: var(--primary);
            padding: 1.2rem 1.5rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .logo-text span {
            color: var(--secondary);
        }

        .badge-resmi {
            background: rgba(201, 169, 89, 0.15);
            border: 1px solid rgba(201, 169, 89, 0.4);
            border-radius: 50px;
            padding: 0.22rem 0.75rem;
            font-size: 0.58rem;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--secondary);
        }

        .gold-line {
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 40%, #e8c97a 60%, var(--secondary) 100%);
        }

        .photo-section {
            background: linear-gradient(170deg, #0a2342 0%, #1a3a6b 100%);
            padding: 2.5rem 2rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .photo-wrap {
            width: 200px;
            height: 250px;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid var(--secondary);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            background: #1a3a6b;
            position: relative;
        }

        .photo-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: linear-gradient(145deg, #1a3a6b 0%, #2c4c7c 100%);
        }

        .photo-placeholder i {
            font-size: 4.5rem;
            color: rgba(201, 169, 89, 0.45);
        }

        .photo-placeholder span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            color: rgba(201, 169, 89, 0.6);
            letter-spacing: 3px;
        }

        .wave {
            width: 100%;
            margin-top: -1px;
            display: block;
            line-height: 0;
        }

        .card-body {
            padding: 1.6rem 2rem 2rem;
            background: #fff;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }

        .eyebrow-line {
            flex: 1;
            height: 1px;
            background: var(--gray-light);
        }

        .eyebrow-text {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--secondary-dark);
            white-space: nowrap;
        }

        .member-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            line-height: 1.2;
            margin-bottom: 1.6rem;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #f6f8fc;
            border: 1px solid var(--gray-light);
            border-radius: 12px;
            padding: 0.85rem 1.1rem;
        }

        .info-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-icon i {
            font-size: 0.85rem;
            color: var(--secondary);
        }

        .info-content {
            flex: 1;
            min-width: 0;
        }

        .info-label {
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--gray);
            margin-bottom: 0.18rem;
        }

        .info-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
            word-break: break-word;
        }

        .card-footer {
            border-top: 1px solid var(--gray-light);
            margin-top: 1.6rem;
            padding-top: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .footer-note {
            font-size: 0.62rem;
            color: var(--gray);
            line-height: 1.5;
        }

        .footer-note strong {
            color: var(--primary-soft);
            display: block;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--primary);
            color: var(--secondary);
            border: none;
            border-radius: 50px;
            padding: 0.55rem 1.1rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-back:hover {
            background: var(--primary-soft);
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <div class="logo-text">PERADI <span>KHARISMA</span></div>
            <div class="badge-resmi">Anggota Resmi</div>
        </div>
        <div class="gold-line"></div>
        <div class="photo-section">
            <div class="photo-wrap" id="photoWrap"></div>
            <svg class="wave" viewBox="0 0 420 40" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                <path d="M0,0 Q105,40 210,20 Q315,0 420,30 L420,40 L0,40 Z" fill="#fff" />
            </svg>
        </div>
        <div class="card-body">
            <div class="eyebrow">
                <div class="eyebrow-line"></div>
                <div class="eyebrow-text">Data Anggota Advokat</div>
                <div class="eyebrow-line"></div>
            </div>
            <div class="member-name" id="memberName">—</div>
            <div class="info-list">
                <div class="info-item">
                    <div class="info-icon"><i class="fas fa-id-badge"></i></div>
                    <div class="info-content">
                        <div class="info-label">Nomor Induk Anggota</div>
                        <div class="info-value" id="memberNo">—</div>
                    </div>
                </div>
                <div class="info-item">
                    <div class="info-icon"><i class="fas fa-calendar-check"></i></div>
                    <div class="info-content">
                        <div class="info-label">Tahun Pengesahan</div>
                        <div class="info-value" id="memberTahun">—</div>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <div class="footer-note"><strong>PERADI KHARISMA</strong>Data resmi & terverifikasi</div>
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Kembali</a>
            </div>
        </div>
    </div>
    <script>
        function getInitials(n) { var w = n.replace(/,.*/, '').trim().split(' '); return w.length >= 2 ? (w[0][0] + w[1][0]).toUpperCase() : w[0].substring(0, 2).toUpperCase(); }
        (function () {
            document.title = ANGGOTA.nama + ' — PERADI KHARISMA';
            document.getElementById('memberName').textContent = ANGGOTA.nama;
            document.getElementById('memberNo').textContent = ANGGOTA.no;
            document.getElementById('memberTahun').textContent = ANGGOTA.tahun;
            var pw = document.getElementById('photoWrap');
            if (ANGGOTA.foto) {
                var img = document.createElement('img');
                img.src = ANGGOTA.foto; img.alt = ANGGOTA.nama;
                img.onerror = function () { pw.innerHTML = '<div class="photo-placeholder"><i class="fas fa-user-tie"></i><span>' + getInitials(ANGGOTA.nama) + '</span></div>'; };
                pw.appendChild(img);
            } else {
                pw.innerHTML = '<div class="photo-placeholder"><i class="fas fa-user-tie"></i><span>' + getInitials(ANGGOTA.nama) + '</span></div>';
            }
        })();
    </script>
</body>

</html>
